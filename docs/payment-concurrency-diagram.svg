<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1140" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#232b45"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b33228"/>
    </marker>
  </defs>

  <rect width="1120" height="1140" fill="#ffffff"/>

  <!-- ============ MAIN THREAD ============ -->
  <text x="560" y="44" text-anchor="middle" font-size="18" font-weight="700" fill="#232b45">MAIN THREAD (producer)</text>

  <rect x="330" y="60" width="460" height="58" rx="8" fill="#ffffff" stroke="#232b45" stroke-width="2"/>
  <text x="560" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#232b45">Buyer clicks Pay</text>
  <text x="560" y="106" text-anchor="middle" font-size="13" fill="#5d6b85" font-family="Consolas, 'Courier New', monospace">HTTP request thread — returns immediately</text>

  <line x1="560" y1="118" x2="560" y2="144" stroke="#232b45" stroke-width="2" marker-end="url(#arr)"/>
  <text x="578" y="138" font-size="12.5" fill="#5d6b85" font-family="Consolas, 'Courier New', monospace">PaymentService.submitToPool()</text>

  <!-- thread pool queue -->
  <rect x="230" y="150" width="660" height="78" rx="8" fill="#f6f7fb" stroke="#232b45" stroke-width="2"/>
  <text x="560" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#232b45" font-family="Consolas, 'Courier New', monospace">paymentExecutor  (LinkedBlockingQueue, size 50)</text>
  <text x="560" y="204" text-anchor="middle" font-size="12.5" fill="#5d6b85" font-family="Consolas, 'Courier New', monospace">4 fixed workers · queue full → 429 "busy, retry" (AbortPolicy)</text>

  <!-- fan out to workers -->
  <path d="M560 228 V252 M125 252 H935" fill="none" stroke="#232b45" stroke-width="2"/>
  <line x1="125" y1="252" x2="125" y2="274" stroke="#232b45" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="395" y1="252" x2="395" y2="274" stroke="#232b45" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="665" y1="252" x2="665" y2="274" stroke="#232b45" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="935" y1="252" x2="935" y2="274" stroke="#232b45" stroke-width="2" marker-end="url(#arr)"/>

  <!-- worker threads -->
  <rect x="30"  y="280" width="190" height="74" rx="8" fill="#ffffff" stroke="#232b45" stroke-width="2"/>
  <rect x="300" y="280" width="190" height="74" rx="8" fill="#ffffff" stroke="#232b45" stroke-width="2"/>
  <rect x="570" y="280" width="190" height="74" rx="8" fill="#ffffff" stroke="#232b45" stroke-width="2"/>
  <rect x="840" y="280" width="190" height="74" rx="8" fill="#ffffff" stroke="#232b45" stroke-width="2"/>
  <text x="125" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#232b45" font-family="Consolas, 'Courier New', monospace">[worker-1]</text>
  <text x="125" y="326" text-anchor="middle" font-size="11.5" fill="#43506a" font-family="Consolas, 'Courier New', monospace">PaymentWorker.</text>
  <text x="125" y="343" text-anchor="middle" font-size="11.5" fill="#43506a" font-family="Consolas, 'Courier New', monospace">executePayment()</text>
  <text x="395" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#232b45" font-family="Consolas, 'Courier New', monospace">[worker-2]</text>
  <text x="395" y="326" text-anchor="middle" font-size="11.5" fill="#43506a" font-family="Consolas, 'Courier New', monospace">PaymentWorker.</text>
  <text x="395" y="343" text-anchor="middle" font-size="11.5" fill="#43506a" font-family="Consolas, 'Courier New', monospace">executePayment()</text>
  <text x="665" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#232b45" font-family="Consolas, 'Courier New', monospace">[worker-3]</text>
  <text x="665" y="326" text-anchor="middle" font-size="11.5" fill="#43506a" font-family="Consolas, 'Courier New', monospace">PaymentWorker.</text>
  <text x="665" y="343" text-anchor="middle" font-size="11.5" fill="#43506a" font-family="Consolas, 'Courier New', monospace">executePayment()</text>
  <text x="935" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#232b45" font-family="Consolas, 'Courier New', monospace">[worker-4]</text>
  <text x="935" y="326" text-anchor="middle" font-size="11.5" fill="#43506a" font-family="Consolas, 'Courier New', monospace">PaymentWorker.</text>
  <text x="935" y="343" text-anchor="middle" font-size="11.5" fill="#43506a" font-family="Consolas, 'Courier New', monospace">executePayment()</text>

  <!-- converge -->
  <path d="M125 354 V378 M395 354 V378 M665 354 V378 M935 354 V378 M125 378 H935 M560 378 V404"
        fill="none" stroke="#232b45" stroke-width="2"/>
  <text x="578" y="398" font-size="12" fill="#5d6b85" font-family="Consolas, 'Courier New', monospace">@Transactional — ONE DB transaction per payment</text>

  <!-- ============ SECURITY LAYERS PIPELINE ============ -->
  <!-- GATE: Layer 4 start -->
  <rect x="220" y="410" width="580" height="76" rx="8" fill="#ffffff" stroke="#232b45" stroke-width="2"/>
  <rect x="222" y="412" width="10" height="72" fill="#7650a2"/>
  <text x="248" y="434" font-size="15" font-weight="700" fill="#7650a2">LAYER 4 · ONE-SHOT PAYMENT CLAIM</text>
  <text x="248" y="456" font-size="13" fill="#232b45" font-family="Consolas, 'Courier New', monospace">paymentRepository.updateStatusIfCurrent()</text>
  <text x="248" y="476" font-size="11.5" fill="#5d6b85">PENDING → PROCESSING · second run of the same payment → ALREADY_HANDLED</text>
  <line x1="560" y1="486" x2="560" y2="510" stroke="#232b45" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 1 -->
  <rect x="220" y="516" width="580" height="76" rx="8" fill="#ffffff" stroke="#232b45" stroke-width="2"/>
  <rect x="222" y="518" width="10" height="72" fill="#187447"/>
  <text x="248" y="540" font-size="15" font-weight="700" fill="#187447">LAYER 1 · ATOMIC LISTING CLAIM</text>
  <text x="248" y="562" font-size="13" fill="#232b45" font-family="Consolas, 'Courier New', monospace">listingRepository.updateStatusIfCurrent()</text>
  <text x="248" y="582" font-size="11.5" fill="#5d6b85">one buyer flips ACTIVE → SOLD · 0 rows updated → ALREADY_SOLD</text>
  <line x1="560" y1="592" x2="560" y2="616" stroke="#232b45" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 3 -->
  <rect x="220" y="622" width="580" height="76" rx="8" fill="#ffffff" stroke="#232b45" stroke-width="2"/>
  <rect x="222" y="624" width="10" height="72" fill="#c9772c"/>
  <text x="248" y="646" font-size="15" font-weight="700" fill="#c9772c">LAYER 3 · DEADLOCK-FREE WALLET LOCKS</text>
  <text x="248" y="668" font-size="13" fill="#232b45" font-family="Consolas, 'Courier New', monospace">walletRepository.findByIdForUpdate()</text>
  <text x="248" y="688" font-size="11.5" fill="#5d6b85">PESSIMISTIC_WRITE · buyer + seller locked, always lowest user_id first</text>
  <line x1="560" y1="698" x2="560" y2="722" stroke="#232b45" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Layer 2 -->
  <rect x="220" y="728" width="580" height="76" rx="8" fill="#ffffff" stroke="#232b45" stroke-width="2"/>
  <rect x="222" y="730" width="10" height="72" fill="#327fa8"/>
  <text x="248" y="752" font-size="15" font-weight="700" fill="#327fa8">LAYER 2 · BALANCE CHECK INSIDE THE UPDATE</text>
  <text x="248" y="774" font-size="13" fill="#232b45" font-family="Consolas, 'Courier New', monospace">walletRepository.debit() / credit()</text>
  <text x="248" y="794" font-size="11.5" fill="#5d6b85">WHERE balance &gt;= amount — no check-then-act gap → no double-spend</text>
  <line x1="560" y1="804" x2="560" y2="828" stroke="#232b45" stroke-width="2" marker-end="url(#arr)"/>

  <!-- CLOSE: Layer 4 end -->
  <rect x="220" y="834" width="580" height="76" rx="8" fill="#ffffff" stroke="#232b45" stroke-width="2"/>
  <rect x="222" y="836" width="10" height="72" fill="#7650a2"/>
  <text x="248" y="858" font-size="15" font-weight="700" fill="#7650a2">LAYER 4 · CONDITIONAL CLOSE</text>
  <text x="248" y="880" font-size="13" fill="#232b45" font-family="Consolas, 'Courier New', monospace">paymentRepository.markCompletedIfCurrent()</text>
  <text x="248" y="900" font-size="11.5" fill="#5d6b85">PROCESSING → COMPLETED · a late failure can never overwrite it</text>
  <line x1="560" y1="910" x2="560" y2="934" stroke="#232b45" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ FAIL SIDEBAR ============ -->
  <rect x="830" y="410" width="270" height="500" rx="10" fill="#fdf0ef" stroke="#b33228" stroke-width="2"/>
  <text x="846" y="438" font-size="14" font-weight="700" fill="#b33228">FAIL PATH (any worker)</text>
  <text x="846" y="464" font-size="12.5" fill="#43506a" font-family="Consolas, 'Courier New', monospace">any layer returns 0 rows</text>
  <text x="846" y="482" font-size="12.5" fill="#43506a" font-family="Consolas, 'Courier New', monospace">or throws:</text>
  <text x="846" y="506" font-size="14" font-weight="700" fill="#b33228">@Transactional</text>
  <text x="846" y="524" font-size="14" font-weight="700" fill="#b33228">ROLLBACK</text>
  <text x="846" y="550" font-size="11.5" fill="#5d6b85">balances, listing status,</text>
  <text x="846" y="566" font-size="11.5" fill="#5d6b85">favorites, transaction —</text>
  <text x="846" y="582" font-size="11.5" fill="#5d6b85">all revert together</text>
  <text x="846" y="612" font-size="12.5" font-weight="700" fill="#b33228" font-family="Consolas, 'Courier New', monospace">PaymentWorker</text>
  <text x="846" y="630" font-size="12.5" font-weight="700" fill="#b33228" font-family="Consolas, 'Courier New', monospace">  .markFailed(id, reason)</text>
  <text x="846" y="658" font-size="11.5" fill="#5d6b85">failIfActive() stamps the</text>
  <text x="846" y="674" font-size="11.5" fill="#5d6b85">reason; PENDING/PROCESSING</text>
  <text x="846" y="690" font-size="11.5" fill="#5d6b85">only — never COMPLETED</text>
  <text x="846" y="720" font-size="11.5" fill="#5d6b85">examples:</text>
  <text x="846" y="740" font-size="12" fill="#43506a" font-family="Consolas, 'Courier New', monospace">ALREADY_SOLD</text>
  <text x="846" y="758" font-size="12" fill="#43506a" font-family="Consolas, 'Courier New', monospace">INSUFFICIENT_FUNDS</text>
  <text x="846" y="776" font-size="12" fill="#43506a" font-family="Consolas, 'Courier New', monospace">ALREADY_HANDLED</text>
  <text x="846" y="794" font-size="12" fill="#43506a" font-family="Consolas, 'Courier New', monospace">QUEUE_FULL → 429</text>

  <!-- dashed connectors layer -> fail path -->
  <line x1="800" y1="448" x2="826" y2="448" stroke="#b33228" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
  <line x1="800" y1="554" x2="826" y2="554" stroke="#b33228" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
  <line x1="800" y1="660" x2="826" y2="660" stroke="#b33228" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
  <line x1="800" y1="766" x2="826" y2="766" stroke="#b33228" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
  <line x1="800" y1="872" x2="826" y2="872" stroke="#b33228" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>

  <!-- ============ COMMITTED / END ============ -->
  <ellipse cx="560" cy="990" rx="330" ry="50" fill="#eef7f1" stroke="#187447" stroke-width="2"/>
  <text x="560" y="984" text-anchor="middle" font-size="15" font-weight="700" fill="#187447">✓ COMMITTED — money moved, listing SOLD, favorites cleaned</text>
  <text x="560" y="1006" text-anchor="middle" font-size="12.5" fill="#43506a" font-family="Consolas, 'Courier New', monospace">after commit → onPaymentCompleted(): audit + seller email</text>
  <line x1="560" y1="1040" x2="560" y2="1048" stroke="#232b45" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="560" cy="1080" r="30" fill="#ffffff" stroke="#232b45" stroke-width="2"/>
  <text x="560" y="1086" text-anchor="middle" font-size="15" font-weight="700" fill="#232b45">End</text>

  <!-- caption -->
  <text x="24" y="1128" font-size="11.5" fill="#5d6b85" font-family="Consolas, 'Courier New', monospace">run order inside executePayment(): LAYER 4 (claim) → LAYER 1 → LAYER 3 → LAYER 2 → LAYER 4 (close)</text>
</svg>
