spring.application.name=media-service
management.endpoints.web.exposure.include=health
server.port=${SERVER_PORT:8088}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Only other services (through the owning service's authorization checks) may upload.
internal.api-token=${INTERNAL_API_TOKEN}

# Optional absolute URL prefix for stored image URLs. It stays empty in every
# normal deployment: the browser loads /api/media/{id} from the marketplace
# origin, so a relative path works on localhost and on the public domain alike.
# Set it only when images are served from a separate CDN host.
media.public-base-url=${MEDIA_PUBLIC_BASE_URL:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
