spring.application.name=media-service
management.endpoints.web.exposure.include=health
server.port=${SERVER_PORT:8088}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Only other services (through the owning service's authorization checks) may upload.
internal.api-token=${INTERNAL_API_TOKEN}

# Absolute URL prefix used in stored image URLs. Set it empty once a gateway
# serves /api/media/** on the frontend origin.
media.public-base-url=${MEDIA_PUBLIC_BASE_URL:http://localhost:8088}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
