<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell an Item - Used Marketplace</title>
    <script th:src="@{/js/auth.js}"></script>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CREATE LISTING STYLES --- */
        body {
            background: #f5f7fa;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .form-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 2.5rem;
        }

        .page-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 1.8rem;
            color: #2c3e50;
            margin: 0;
        }

        .back-link {
            color: var(--brand);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .back-link:hover { text-decoration: underline; }

        /* Form Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .required-star { color: #e74c3c; }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(160, 108, 213, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        select.form-control {
            cursor: pointer;
        }

        /* Image Upload Area */
        .image-upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
            position: relative;
            overflow: hidden;
        }

        .image-upload-area:hover {
            border-color: var(--brand);
            background: #fdfaff;
        }

        .image-upload-area.has-image {
            padding: 0;
            border-style: solid;
            border-color: #eee;
        }

        .upload-icon {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 1rem;
        }

        .upload-text {
            color: #666;
            font-size: 0.95rem;
        }

        .preview-img {
            width: 100%;
            height: 300px;
            /* Show the whole photo in the preview: the seller must see what they picked. */
            object-fit: contain;
            background: #f4f5f7;
            display: none;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: none;
            z-index: 10;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: var(--brand-gradient);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 1rem;
        }

        .submit-btn:hover { opacity: 0.95; }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2ecc71;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 9999;
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .category-picker { position: relative; }
        .category-toggle {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px;
            background: white; color: #344054; font-size: 1rem; cursor: pointer;
            text-align: left;
        }
        .category-toggle:focus-visible { border-color: var(--brand); outline: 3px solid rgba(160,108,213,.12); }
        .category-menu {
            position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 120;
            background: white; border: 1px solid #ddd; border-radius: 10px;
            box-shadow: 0 10px 28px rgba(0,0,0,.14); padding: 10px;
        }
        .category-search { width: 100%; margin-bottom: 8px; }
        .category-options { max-height: 280px; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 4px; }
        .category-option { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 7px; cursor: pointer; }
        .category-option:hover { background: #f5f3ff; }
        .category-option input { accent-color: var(--brand); }
        .selected-categories { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
        .category-chip { background: #eef2ff; color: #4f46e5; padding: 5px 10px; border-radius: 16px; font-size: .88rem; font-weight: 600; }
        @media (max-width: 620px) { .category-options { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="/css/theme.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: nav}"></div>

<div class="page-container">
    <div class="form-card">

        <div class="page-header">
            <h1 class="page-title">Sell an Item</h1>
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <form id="createListingForm">

            <!-- Title & Price -->
            <div class="form-grid">
                <div class="input-group full-width">
                    <label>Title <span class="required-star">*</span></label>
                    <input type="text" id="title" class="form-control" placeholder="e.g., iPhone 13 Pro Max 256GB" required maxlength="100">
                </div>

                <div class="input-group">
                    <label>Price (BHD) <span class="required-star">*</span></label>
                    <input type="number" id="price" class="form-control" placeholder="0.00" required min="0.01" step="0.01">
                </div>

                <div class="input-group">
                    <label>Condition <span class="required-star">*</span></label>
                    <select id="condition" class="form-control" required>
                        <option value="" disabled selected>Select Condition</option>
                        <option value="New">New</option>
                        <option value="Like New">Like New</option>
                        <option value="Excellent">Excellent</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                        <option value="Poor">Poor</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Location <span class="required-star">*</span></label>
                    <input type="text" id="location" class="form-control" placeholder="City/Area" required>
                </div>

                <div class="input-group full-width">
                    <label>Categories <span class="required-star">*</span></label>
                    <div class="category-picker" id="categoryPicker">
                        <button type="button" id="categoryToggle" class="category-toggle"
                                aria-expanded="false" aria-controls="categoryMenu">
                            <span id="categoryToggleText">Select up to 5 categories</span>
                            <span aria-hidden="true">▾</span>
                        </button>
                        <div id="categoryMenu" class="category-menu" hidden>
                            <input type="search" id="categorySearch" class="form-control category-search"
                                   placeholder="Search categories…" autocomplete="off">
                            <div id="categoryOptions" class="category-options" role="group" aria-label="Available categories"></div>
                        </div>
                    </div>
                    <div id="selectedCategories" class="selected-categories" aria-live="polite"></div>
                    <small style="color:#888;">Choose one or more relevant categories (maximum 5).</small>
                </div>

                <div class="input-group full-width">
                    <label>Description <span class="required-star">*</span></label>
                    <textarea id="description" class="form-control" placeholder="Describe the item, mention any flaws, accessories included, etc." required minlength="10"></textarea>
                </div>
            </div>

            <!-- Image Upload -->
            <div class="input-group full-width">
                <label>Item Photo</label>
                <div class="image-upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-cloud-upload-alt upload-icon"></i>
                    <p class="upload-text">Click to upload or drag and drop<br><small>PNG, JPG up to 5MB</small></p>
                    <img id="previewImg" class="preview-img" alt="Preview">
                    <button type="button" id="removeImgBtn" class="remove-btn">&times;</button>
                </div>
                <input type="file" id="fileInput" accept="image/jpeg,image/png,.jpg,.jpeg,.png" style="display:none;" onchange="handleFileSelect(this)">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Post Listing</button>
        </form>
    </div>
</div>

<div id="toast">Listing created successfully!</div>

<script>
    let selectedFile = null;
    let allCategories = []; // Cache loaded categories
    let selectedCategoryIds = []; // Track IDs for submission

    document.addEventListener('DOMContentLoaded', async () => {
        await checkAuth();
        await loadCategories();
        setupDragDrop();
        setupCategoryPicker();
    });

    async function checkAuth() {
        if (!(await getSession())) {
            if (window.AppErrors) AppErrors.showToast("You must be logged in to sell an item.", true); else alert("You must be logged in to sell an item.");
            window.location.href = '/login';
        }
    }

    // --- MULTI-CATEGORY DROPDOWN ---
    async function loadCategories() {
        try {
            const res = await authenticatedFetch('/api/categories');
            if (!res.ok) throw new Error('Category request failed');
            allCategories = await res.json();
            renderCategoryOptions('');
        } catch (err) {
            console.error("Failed to load categories", err);
            document.getElementById('categoryOptions').innerHTML =
                '<div style="padding:10px;color:#c0392b;">Categories could not be loaded. Refresh and try again.</div>';
        }
    }

    function setupCategoryPicker() {
        const picker = document.getElementById('categoryPicker');
        const toggle = document.getElementById('categoryToggle');
        const menu = document.getElementById('categoryMenu');
        const search = document.getElementById('categorySearch');

        toggle.addEventListener('click', () => {
            menu.hidden = !menu.hidden;
            toggle.setAttribute('aria-expanded', String(!menu.hidden));
            if (!menu.hidden) search.focus();
        });
        search.addEventListener('input', () => renderCategoryOptions(search.value));
        document.addEventListener('click', event => {
            if (!picker.contains(event.target)) {
                menu.hidden = true;
                toggle.setAttribute('aria-expanded', 'false');
            }
        });
    }

    function renderCategoryOptions(query) {
        const normalized = String(query || '').trim().toLowerCase();
        const matches = allCategories.filter(category =>
            category.name.toLowerCase().includes(normalized));
        const options = document.getElementById('categoryOptions');
        if (!matches.length) {
            options.innerHTML = '<div style="padding:10px;color:#888;">No matching categories</div>';
            return;
        }
        options.replaceChildren(...matches.map(category => {
            const label = document.createElement('label');
            label.className = 'category-option';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = category.id;
            checkbox.checked = selectedCategoryIds.includes(category.id);
            checkbox.addEventListener('change', () => changeCategory(category, checkbox));
            const name = document.createElement('span');
            name.textContent = category.name;
            label.append(checkbox, name);
            return label;
        }));
    }

    function changeCategory(category, checkbox) {
        if (checkbox.checked) {
            if (selectedCategoryIds.length >= 5) {
                checkbox.checked = false;
                showToast('Choose no more than 5 categories.', true);
                return;
            }
            selectedCategoryIds.push(category.id);
        } else {
            selectedCategoryIds = selectedCategoryIds.filter(id => id !== category.id);
        }
        renderSelectedCategories();
    }

    function renderSelectedCategories() {
        const selected = allCategories.filter(category => selectedCategoryIds.includes(category.id));
        document.getElementById('categoryToggleText').textContent = selected.length
            ? `${selected.length} categor${selected.length === 1 ? 'y' : 'ies'} selected`
            : 'Select up to 5 categories';
        const chips = document.getElementById('selectedCategories');
        chips.replaceChildren(...selected.map(category => {
            const chip = document.createElement('span');
            chip.className = 'category-chip';
            chip.textContent = category.name;
            return chip;
        }));
    }

    // --- IMAGE HANDLING (Same as before) ---
    function handleFileSelect(input) {
        const file = input.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { showToast("That image is larger than 5 MB. Please choose a smaller photo.", true); return; }
        // Media stores JPEG and PNG only. Accepting HEIC/WebP/GIF here would let
        // the seller believe the photo uploaded while the server rejected it.
        const allowed = ['image/jpeg', 'image/png'];
        if (!allowed.includes(file.type)) {
            showToast("Only JPEG and PNG images are supported. Please convert this photo and choose it again.", true);
            input.value = '';
            return;
        }

        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = document.getElementById('previewImg');
            img.src = e.target.result;
            img.style.display = 'block';
            document.querySelector('.upload-icon').style.display = 'none';
            document.querySelector('.upload-text').style.display = 'none';
            document.getElementById('removeImgBtn').style.display = 'block';
            document.getElementById('dropZone').classList.add('has-image');
        };
        reader.readAsDataURL(file);
    }

    document.getElementById('removeImgBtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedFile = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('previewImg').style.display = 'none';
        document.querySelector('.upload-icon').style.display = 'block';
        document.querySelector('.upload-text').style.display = 'block';
        document.getElementById('removeImgBtn').style.display = 'none';
        document.getElementById('dropZone').classList.remove('has-image');
    });

    function setupDragDrop() {
        const zone = document.getElementById('dropZone');
        ['dragenter', 'dragover'].forEach(eventName => {
            zone.addEventListener(eventName, (e) => { e.preventDefault(); zone.style.borderColor = 'var(--brand)'; }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            zone.addEventListener(eventName, (e) => { e.preventDefault(); zone.style.borderColor = '#ddd'; }, false);
        });
        zone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length) handleFileSelect({ files: files });
        }, false);
    }

    // --- SUBMIT FORM ---
    document.getElementById('createListingForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const loggedIn = !!(await getSession());
        if (!loggedIn) { window.location.href = '/login'; return; }
        if (selectedCategoryIds.length === 0) {
            showToast('Choose at least one category.', true);
            document.getElementById('categoryToggle').focus();
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Publishing...';

        // Construct Payload with Categories Array
        const listingData = {
            title: document.getElementById('title').value.trim(),
            description: document.getElementById('description').value.trim(),
            price: parseFloat(document.getElementById('price').value),
            condition: document.getElementById('condition').value,
            location: document.getElementById('location').value.trim(),
            status: "ACTIVE",
            // Send array of objects with just ID, matching @ManyToMany expectation
            categories: selectedCategoryIds.map(id => ({ id: id }))
        };

        try {
            const res = await authenticatedFetch('/api/listings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(listingData)
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(errText || "Failed to create listing");
            }

            const createdListing = await res.json();
            const listingId = createdListing.id;

            // Upload Image if present
            if (selectedFile) {
                const formData = new FormData();
                formData.append('img', selectedFile);
                const imgRes = await authenticatedFetch(`/api/listings/${listingId}/image`, {
                    method: 'PUT',
                    body: formData
                });

                if (!imgRes.ok) {
                    // The listing exists; never claim success for a photo that
                    // was not stored. Send the seller to their listing so the
                    // image can be retried from there or replaced.
                    const failure = await imgRes.json().catch(() => ({}));
                    const reason = failure.message || 'the server rejected the image';
                    showToast('Listing published, but the photo was not saved: ' + reason, true);
                    setTimeout(() => window.location.href = '/listing/' + listingId, 2500);
                    return;
                }
            }

            showToast("Listing published successfully!");
            setTimeout(() => window.location.href = '/', 1500);

        } catch (err) {
            console.error(err);
            showToast("Error: " + err.message, true);
            btn.disabled = false;
            btn.textContent = 'Post Listing';
        }
    });

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#e74c3c' : '#2ecc71';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
</script>

</div>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/cod-ping.js}"></script>

</body>
</html>
