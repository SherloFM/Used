spring.application.name=audit-service
management.endpoints.web.exposure.include=health
server.port=${SERVER_PORT:8087}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# HS256 JWT shared with Accounts; JWT_SECRET is the Base64 encoding of 32+ random bytes.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:used-accounts}
security.jwt.audience=${JWT_AUDIENCE:used-api}
security.auth-cookie.name=${AUTH_COOKIE_NAME:used_auth}
# Set false explicitly for local HTTP development only.
security.auth-cookie.secure=${AUTH_COOKIE_SECURE:true}
security.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:8080}

# Shared service-to-service token; at least 32 characters, no default.
internal.api-token=${INTERNAL_API_TOKEN}
