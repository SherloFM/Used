spring.application.name=marketplace-service
management.endpoints.web.exposure.include=health
server.port=${SERVER_PORT:8083}

# Browser uploads arrive here before Marketplace forwards them to Media.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# HS256 JWT shared with Accounts; JWT_SECRET is the Base64 encoding of 32+ random bytes.
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:used-accounts}
security.jwt.audience=${JWT_AUDIENCE:used-api}
security.auth-cookie.name=${AUTH_COOKIE_NAME:used_auth}
# Set false explicitly for local HTTP development only.
security.auth-cookie.secure=${AUTH_COOKIE_SECURE:true}
security.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:8080}

# Accounts internal API (service-to-service).
services.accounts.base-url=${ACCOUNTS_BASE_URL:http://localhost:8081}
services.audit.base-url=${AUDIT_BASE_URL:http://localhost:8087}
services.notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:8085}
# Media stores image bytes; Marketplace keeps only the returned immutable URL.
services.media.base-url=${MEDIA_BASE_URL:http://localhost:8088}
internal.api-token=${INTERNAL_API_TOKEN}

# RabbitMQ: listing lifecycle and status consistency.
# Defaults are for local development only; set these in every real environment.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
# Do not lose messages silently: confirm broker acceptance, return unroutable ones.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# A rejected listener message is not requeued in a hot loop. It is retried a few
# times, then dead-lettered for inspection. Moderation's delist retry sweep is
# the loop that actually recovers the saga.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s

# Kafka distributes wallet-payment jobs only; RabbitMQ still carries listing events.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=com.example.marketplace.messaging.payment.PaymentKafkaValueSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=10000
spring.kafka.producer.properties.delivery.timeout.ms=30000
spring.kafka.consumer.group-id=marketplace-payment-workers
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=1
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.marketplace.messaging.payment.PaymentRequested
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.marketplace.messaging.payment
spring.kafka.consumer.properties.max.poll.interval.ms=300000
payment.kafka.concurrency=${PAYMENT_KAFKA_CONCURRENCY:3}
payment.kafka.recovery-interval-ms=${PAYMENT_KAFKA_RECOVERY_INTERVAL_MS:60000}
payment.kafka.recovery-stale-seconds=${PAYMENT_KAFKA_RECOVERY_STALE_SECONDS:120}
payment.kafka.recovery-batch-size=100

# Almotawaj Wallet gateway. The API key and signing secret stay on the server:
# the browser only ever receives the checkout URL. An empty key makes the
# checkout page report that wallet payments are not available yet.
wallet.gateway.base-url=${WALLET_GATEWAY_BASE_URL:https://wallet.almotawaj.com}
wallet.gateway.api-key=${WALLET_GATEWAY_API_KEY:}
wallet.gateway.signing-secret=${WALLET_GATEWAY_SIGNING_SECRET:}
# Public origin of this site; the gateway sends the buyer back to
# {public-base-url}/payment/{listingId}?sessionId=...&orderReference=...
wallet.gateway.public-base-url=${WALLET_GATEWAY_PUBLIC_BASE_URL:http://localhost:8080}
