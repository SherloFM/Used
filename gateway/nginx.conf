# Browser edge: one origin for pages and APIs.
#
# The frontend sets no cookies itself, but Accounts issues the HttpOnly
# `used_auth` cookie and the `used_csrf` cookie on this same origin. That is why
# the browser talks to this proxy instead of the services directly: no CORS with
# credentials, no SameSite=None, and EventSource can send the session cookie
# without any JavaScript help.
#
# Route ownership mirrors docs/architecture-decisions.md. Add new browser routes
# here and here only.

# Upstream names are resolved lazily, at request time, through Docker's embedded
# DNS. That is deliberate: with static `upstream` blocks nginx resolves every
# hostname while it loads its config and refuses to start if one service is
# down, which would keep the whole UI unreachable because a single service is
# restarting. With this resolver a missing upstream only turns its own routes
# into 502 until it comes back.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Media rejects anything over 5 MB itself and spring.servlet.multipart
    # caps the request at 6 MB. Keep the transport ceiling above both so
    # nginx never turns a validation error into a 413.
    client_max_body_size 8m;

    # nginx defaults proxy_read_timeout to 60s, which is too eager here: a
    # payment write, a moderation delist, or a cold-cache query can outlast it
    # and the browser would show 504 while the server still commits.
    proxy_connect_timeout 5s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Service addresses, resolved lazily (see resolver above).
    set $accounts     http://accounts-service:8081;
    set $chat         http://chat-service:8082;
    set $marketplace  http://marketplace-service:8083;
    set $favorites    http://favorites-service:8084;
    set $notification http://notification-service:8085;
    set $moderation   http://moderation-service:8086;
    set $media        http://media-service:8088;
    set $frontend     http://frontend-service:8080;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Service-to-service surface and per-service actuators are never reachable
    # from a browser. Longest-prefix matching keeps these ahead of the routes
    # below, so /api/internal/media cannot fall through to Media.
    location /api/internal/ { return 404; }
    location /actuator/     { return 404; }

    # Accounts: authentication, profile, admin user management.
    location /auth/user/      { proxy_pass $accounts$request_uri; }
    location /api/profile     { proxy_pass $accounts$request_uri; }
    location /api/admin/users { proxy_pass $accounts$request_uri; }

    # Moderation: reports and the admin report queue.
    location /api/admin/reports { proxy_pass $moderation$request_uri; }
    location /api/reports       { proxy_pass $moderation$request_uri; }

    # Marketplace: listings, categories, payments, wallet.
    location /api/listings   { proxy_pass $marketplace$request_uri; }
    location /api/categories { proxy_pass $marketplace$request_uri; }
    location /api/payments   { proxy_pass $marketplace$request_uri; }
    location /api/wallet     { proxy_pass $marketplace$request_uri; }

    location /api/favorites { proxy_pass $favorites$request_uri; }
    location /api/media/    { proxy_pass $media$request_uri; }
    location /api/chat      { proxy_pass $chat$request_uri; }

    # STOMP endpoint. The upgrade headers above do the work; the long timeout
    # keeps an idle socket open instead of dropping it mid-conversation.
    location /ws {
        proxy_pass $chat$request_uri;
        proxy_read_timeout 1h;
    }

    # Server-sent events. Buffering would hold notifications until the buffer
    # flushes, which is exactly what this endpoint must not do.
    location = /api/notifications/stream {
        proxy_pass $notification$request_uri;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }
    location /api/notifications/ { proxy_pass $notification$request_uri; }

    # Pages, CSS, JS, images.
    location / { proxy_pass $frontend$request_uri; }
}
