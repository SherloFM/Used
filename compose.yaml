name: used-marketplace

x-app-environment: &app-environment
  DB_HOST: postgres_db
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:-used}
  DB_USER: ${POSTGRES_USER:-used}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
  # Local HTTP development only.
  AUTH_COOKIE_SECURE: "false"
  FRONTEND_ORIGINS: http://localhost:8080
  # The Docker Desktop WSL2 VM has ~7.7 GiB. Each JVM sees that as its own
  # memory and defaults to ~1.9 GiB heap, so nine services fight for the same
  # pool and the OOM killer steps in. Cap the heap explicitly.
  JAVA_TOOL_OPTIONS: "-Xmx384m -Xms128m"

x-rabbit-environment: &rabbit-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-used}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks:
    - used

x-db-dependencies: &db-dependencies
  postgres_db:
    condition: service_healthy

x-db-rabbit-dependencies: &db-rabbit-dependencies
  postgres_db:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres_db:
    image: postgres:18.6
    restart: unless-stopped
    # Dev only: fsync/full_page_writes off makes recovery and bulk loads fast on
    # the WSL2 disk. Production (RDS) keeps the defaults; never ship these.
    command: >
      postgres
      -c fsync=off
      -c full_page_writes=off
      -c synchronous_commit=off
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-used}
      POSTGRES_USER: ${POSTGRES_USER:-used}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - used

  rabbitmq:
    image: rabbitmq:4.4.0-management
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-used}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - used

  accounts-service:
    <<: *app-defaults
    image: used/accounts-service:${IMAGE_TAG:-local}
    build:
      context: ./services/accounts-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *app-environment
      SERVER_PORT: "8081"
      AUDIT_BASE_URL: http://audit-service:8087
      NOTIFICATION_BASE_URL: http://notification-service:8085
      MEDIA_BASE_URL: http://media-service:8088
    depends_on: *db-dependencies

  chat-service:
    <<: *app-defaults
    image: used/chat-service:${IMAGE_TAG:-local}
    build:
      context: ./services/chat-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: *app-environment
      SERVER_PORT: "8082"
      ACCOUNTS_BASE_URL: http://accounts-service:8081
      MARKETPLACE_BASE_URL: http://marketplace-service:8083
    depends_on: *db-dependencies

  marketplace-service:
    <<: *app-defaults
    image: used/marketplace-service:${IMAGE_TAG:-local}
    build:
      context: ./services/marketplace-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      <<: [*app-environment, *rabbit-environment]
      SERVER_PORT: "8083"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PAYMENT_KAFKA_CONCURRENCY: ${PAYMENT_KAFKA_CONCURRENCY:-3}
      ACCOUNTS_BASE_URL: http://accounts-service:8081
      AUDIT_BASE_URL: http://audit-service:8087
      NOTIFICATION_BASE_URL: http://notification-service:8085
      MEDIA_BASE_URL: http://media-service:8088
    depends_on:
      postgres_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  favorites-service:
    <<: *app-defaults
    image: used/favorites-service:${IMAGE_TAG:-local}
    build:
      context: ./services/favorites-service
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      <<: [*app-environment, *rabbit-environment]
      SERVER_PORT: "8084"
      ACCOUNTS_BASE_URL: http://accounts-service:8081
      MARKETPLACE_BASE_URL: http://marketplace-service:8083
      NOTIFICATION_BASE_URL: http://notification-service:8085
    depends_on: *db-rabbit-dependencies

  notification-service:
    <<: *app-defaults
    image: used/notification-service:${IMAGE_TAG:-local}
    build:
      context: ./services/notification-service
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      <<: [*app-environment, *rabbit-environment]
      SERVER_PORT: "8085"
      ACCOUNTS_BASE_URL: http://accounts-service:8081
      SPRING_MAIL_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: "5000"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: "5000"
    depends_on: *db-rabbit-dependencies

  moderation-service:
    <<: *app-defaults
    image: used/moderation-service:${IMAGE_TAG:-local}
    build:
      context: ./services/moderation-service
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      <<: [*app-environment, *rabbit-environment]
      SERVER_PORT: "8086"
      ACCOUNTS_BASE_URL: http://accounts-service:8081
      MARKETPLACE_BASE_URL: http://marketplace-service:8083
    depends_on: *db-rabbit-dependencies

  audit-service:
    <<: *app-defaults
    image: used/audit-service:${IMAGE_TAG:-local}
    build:
      context: ./services/audit-service
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      <<: *app-environment
      SERVER_PORT: "8087"
    depends_on: *db-dependencies

  media-service:
    <<: *app-defaults
    image: used/media-service:${IMAGE_TAG:-local}
    build:
      context: ./services/media-service
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      <<: *app-environment
      SERVER_PORT: "8088"
      # Empty means Media returns a relative /api/media/{id} path, so stored
      # URLs are resolved against whatever origin the browser is already on.
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
    depends_on: *db-dependencies

  frontend-service:
    <<: *app-defaults
    image: used/frontend-service:${IMAGE_TAG:-local}
    build:
      context: ./services/frontend-service
    # No published port: the gateway owns 8080 and reaches this over the network.
    environment:
      SERVER_PORT: "8080"

  gateway:
    <<: *app-defaults
    image: nginx:1.29-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    # service_started, not service_healthy, on purpose. nginx resolves the
    # upstream hostnames when it loads its config, so all it needs is for the
    # containers to exist. Gating on health would hold the edge closed for the
    # several minutes a Spring context takes to bind here, and one crash-looping
    # service would keep the whole UI unreachable.
    depends_on:
      accounts-service:
        condition: service_started
      chat-service:
        condition: service_started
      marketplace-service:
        condition: service_started
      favorites-service:
        condition: service_started
      notification-service:
        condition: service_started
      moderation-service:
        condition: service_started
      media-service:
        condition: service_started
      frontend-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Set KAFKA_CLUSTER_ID in .env}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - used

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on: *db-dependencies
    networks:
      - used

networks:
  used:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  pgadmin_data:
  kafka_data:
