# --- DATABASE (From Env Vars) ---
# These variables MUST be set in your server/hosting dashboard
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
# NEVER use 'update' in prod. Use 'validate' to ensure entity matches DB,
# or 'none' if you manage migrations separately (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- MAIL (From Env Vars) ---
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- SECURITY (From Env Vars) ---
# Generate a strong random secret for prod and store it securely
jwt-secret=${JWT_SECRET}
jwt-expiration-ms=86400000

# --- PRODUCTION HARDENING ---
# Hide stack traces from end-users
spring.web.error.include-stacktrace=NEVER
# Reduce log noise
logging.level.root=WARN
logging.level.org.springframework.web=ERROR