<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email - Used Marketplace</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* --- VERIFY PAGE STYLES --- */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6ec3f4 0%, #a06cd5 100%);
            padding: 2rem;
        }

        .disabled-link {
    color: #ccc !important;
    cursor: not-allowed !important;
    text-decoration: none !important;
}

        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            text-align: center;
        }

        .icon-badge {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #eafaf1;
            color: #27ae60;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem;
        }

        h1 {
            font-size: 1.6rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        p.sub {
            color: #777;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .email-display {
            font-weight: 700;
            color: #a06cd5;
            word-break: break-all;
        }

        /* Code Input Styling */
        .code-input-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .code-input {
            width: 100%;
            padding: 14px;
            text-align: center;
            font-size: 1.8rem;
            letter-spacing: 0.6em; /* Spacing between digits */
            border: 2px solid #eee;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s;
            font-family: monospace;
        }

        .code-input:focus {
            border-color: #a06cd5;
            box-shadow: 0 0 0 4px rgba(160, 108, 213, 0.1);
        }

        /* Buttons */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #6ec3f4, #a06cd5);
            color: white;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .submit-btn:hover { opacity: 0.95; }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .resend-link {
            display: block;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #888;
            text-decoration: none;
        }
        .resend-link:hover { color: #a06cd5; text-decoration: underline; }

        /* Messages */
        .msg-box {
            margin-top: 1.5rem;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .msg-error { background: #fdecea; color: #c0392b; border: 1px solid #f5c6cb; display: block; }
        .msg-success { background: #eafaf1; color: #27ae60; border: 1px solid #c3e6cb; display: block; }

    </style>
</head>
<body class="auth-container">

<div class="auth-card">
    <div class="icon-badge">
        <i class="fas fa-envelope-open-text"></i>
    </div>

    <h1>Check Your Inbox</h1>

    <p class="sub">
        We sent a 6-digit verification code to:<br>
        <span id="emailLabel" class="email-display">loading...</span>
    </p>

    <div class="code-input-wrapper">
        <!-- Auto-focus enabled via JS below -->
        <input type="text"
               id="codeInput"
               class="code-input"
               maxlength="6"
               inputmode="numeric"
               placeholder="______"
               autocomplete="one-time-code">
    </div>

    <button class="submit-btn" id="verifyBtn">Verify Email</button>

    <div id="statusMsg" class="msg-box"></div>

    <a href="#" id="resendLink" class="resend-link">Didn't receive the code?</a>
</div>

<script>
    // --- CONFIGURATION ---
    const COOLDOWN_SECONDS = 60; // Must match backend

    // --- STATE VARIABLES ---
    let timerInterval = null;
    let remainingTime = COOLDOWN_SECONDS;
    let isInitialLoad = true;

    // --- DOM ELEMENTS ---
    const params = new URLSearchParams(window.location.search);
    let email = params.get('email') || sessionStorage.getItem('pendingVerifyEmail');

    const emailLabel = document.getElementById('emailLabel');
    const codeInput = document.getElementById('codeInput');
    const verifyBtn = document.getElementById('verifyBtn');
    const msgBox = document.getElementById('statusMsg');
    const resendLink = document.getElementById('resendLink');
    const timerDisplay = document.getElementById('timerDisplay'); // We will add this element below

    // --- INITIALIZATION ---
    function init() {
        if (email) {
            emailLabel.textContent = email;
            setTimeout(() => codeInput.focus(), 100);

            // Start Timer immediately on load
            startCooldownTimer();
        } else {
            emailLabel.textContent = "Unknown Account";
            emailLabel.style.color = "#e74c3c";
            showMessage("Session expired. Please register again.", "error");
            verifyBtn.disabled = true;
            resendLink.style.display = 'none';
        }
    }

    // --- TIMER LOGIC ---
    function startCooldownTimer() {
        clearInterval(timerInterval);
        remainingTime = COOLDOWN_SECONDS;

        // Disable link visually
        resendLink.classList.add('disabled-link');
        resendLink.textContent = `Resend available in ${remainingTime}s`;

        timerInterval = setInterval(() => {
            remainingTime--;
            resendLink.textContent = `Resend available in ${remainingTime}s`;

            if (remainingTime <= 0) {
                clearInterval(timerInterval);
                enableResendButton();
            }
        }, 1000);
    }

    function enableResendButton() {
        resendLink.classList.remove('disabled-link');
        resendLink.textContent = "Didn't receive the code? Resend";
        resendLink.onclick = handleResend;
    }

    // --- RESEND API CALL ---
    async function handleResend(e) {
        e.preventDefault();

        // Prevent double clicks while processing
        resendLink.onclick = null;
        resendLink.textContent = "Sending...";

        try {
            const res = await fetch('/auth/user/resend-verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            if (res.ok) {
                showMessage("New code sent! Check your inbox.", "success");
                // Restart timer after successful send
                startCooldownTimer();
            } else if (res.status === 429) {
                // Backend rate limit hit (shouldn't happen if UI timer works, but good fallback)
                const text = await res.text();
                showMessage(text, "error");
                startCooldownTimer(); // Reset UI timer based on backend feedback
            } else {
                const text = await res.text();
                showMessage(text || "Failed to send code.", "error");
                enableResendButton(); // Allow retry on network/server error
            }
        } catch (err) {
            showMessage("Network error. Try again.", "error");
            enableResendButton();
        }
    }

    // --- VERIFY API CALL (Existing Logic, slightly tweaked) ---
    async function handleVerify() {
        if (!email) return;
        const code = codeInput.value.trim();

        if (code.length !== 6) {
            showMessage("Please enter the full 6-digit code.", "error");
            return;
        }

        setLoading(true);

        try {
            const res = await fetch('/auth/user/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, code: code })
            });

            if (res.ok) {
                showMessage("Email verified successfully! Redirecting...", "success");
                sessionStorage.removeItem('pendingVerifyEmail');
                setTimeout(() => window.location.href = '/', 1500);
            } else {
                const errorText = await res.text();
                showMessage(errorText || "Invalid or expired code.", "error");
                setLoading(false);
                codeInput.select();
            }
        } catch (err) {
            showMessage("Network error.", "error");
            setLoading(false);
        }
    }

    // --- HELPERS ---
    function showMessage(text, type) {
        msgBox.textContent = text;
        msgBox.className = 'msg-box msg-' + type;
    }

    function setLoading(isLoading) {
        if (isLoading) {
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';
        } else {
            verifyBtn.disabled = false;
            verifyBtn.textContent = 'Verify Email';
        }
    }

    // --- EVENT LISTENERS ---
    verifyBtn.addEventListener('click', handleVerify);
    codeInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') handleVerify(); });
    codeInput.addEventListener('input', (e) => { e.target.value = e.target.value.replace(/\D/g, ''); });

    // Run Init
    init();

</script>

</body>
</html>
