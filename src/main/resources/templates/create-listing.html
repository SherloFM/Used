<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell an Item - Used Marketplace</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CREATE LISTING STYLES --- */
        body {
            background: #f5f7fa;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .form-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 2.5rem;
        }

        .page-header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .page-title {
            font-size: 1.8rem;
            color: #2c3e50;
            margin: 0;
        }

        .back-link {
            color: #a06cd5;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .back-link:hover { text-decoration: underline; }

        /* Form Layout */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .required-star { color: #e74c3c; }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        .form-control:focus {
            border-color: #a06cd5;
            box-shadow: 0 0 0 3px rgba(160, 108, 213, 0.1);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        select.form-control {
            cursor: pointer;
        }

        /* Image Upload Area */
        .image-upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
            position: relative;
            overflow: hidden;
        }

        .image-upload-area:hover {
            border-color: #a06cd5;
            background: #fdfaff;
        }

        .image-upload-area.has-image {
            padding: 0;
            border-style: solid;
            border-color: #eee;
        }

        .upload-icon {
            font-size: 3rem;
            color: #ccc;
            margin-bottom: 1rem;
        }

        .upload-text {
            color: #666;
            font-size: 0.95rem;
        }

        .preview-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: none;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(231, 76, 60, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: none;
            z-index: 10;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #6ec3f4, #a06cd5);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 1rem;
        }

        .submit-btn:hover { opacity: 0.95; }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2ecc71;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 9999;
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .tag-input-container {
    position: relative;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px;
    background: white;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 45px;
    cursor: text;
}

.tag-input-container:focus-within {
    border-color: #a06cd5;
    box-shadow: 0 0 0 3px rgba(160, 108, 213, 0.1);
}

.tags-list {
    display: contents; /* Allows children to participate in parent flex layout */
}

.tag-chip {
    background: #eef2ff;
    color: #4f46e5;
    padding: 4px 10px;
    border-radius: 15px;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 5px;
    animation: fadeIn 0.2s ease;
}

.tag-chip span {
    font-weight: 600;
}

.tag-remove {
    cursor: pointer;
    color: #9ca3af;
    font-size: 1.1rem;
    line-height: 1;
}
.tag-remove:hover { color: #ef4444; }

.tag-field {
    flex-grow: 1;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
    padding: 4px !important;
    min-width: 150px;
}

.suggestions-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: white;
    border: 1px solid #ddd;
    border-top: none;
    border-radius: 0 0 8px 8px;
    max-height: 200px;
    overflow-y: auto;
    z-index: 100;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.suggestion-item {
    padding: 10px 15px;
    cursor: pointer;
    transition: background 0.2s;
}

.suggestion-item:hover {
    background: #f3f4f6;
    color: #a06cd5;
}

.no-results {
    padding: 10px 15px;
    color: #999;
    font-style: italic;
}
    </style>
</head>
<body>

<div class="container">
    <div class="form-card">

        <div class="page-header">
            <h1 class="page-title">Sell an Item</h1>
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <form id="createListingForm">

            <!-- Title & Price -->
            <div class="form-grid">
                <div class="input-group full-width">
                    <label>Title <span class="required-star">*</span></label>
                    <input type="text" id="title" class="form-control" placeholder="e.g., iPhone 13 Pro Max 256GB" required maxlength="100">
                </div>

                <div class="input-group">
                    <label>Price ($) <span class="required-star">*</span></label>
                    <input type="number" id="price" class="form-control" placeholder="0.00" required min="0.01" step="0.01">
                </div>

                <div class="input-group">
                    <label>Condition <span class="required-star">*</span></label>
                    <select id="condition" class="form-control" required>
                        <option value="" disabled selected>Select Condition</option>
                        <option value="New">New</option>
                        <option value="Like New">Like New</option>
                        <option value="Excellent">Excellent</option>
                        <option value="Good">Good</option>
                        <option value="Fair">Fair</option>
                        <option value="Poor">Poor</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Location <span class="required-star">*</span></label>
                    <input type="text" id="location" class="form-control" placeholder="City/Area" required>
                </div>

                <div class="input-group full-width">
                    <label>Tags / Categories</label>
                    <div class="tag-input-container" id="tagContainer">
                        <!-- Selected Tags will appear here -->
                        <div id="selectedTags" class="tags-list"></div>

                        <!-- Input Field -->
                        <input type="text"
                               id="categoryInput"
                               class="form-control tag-field"
                               placeholder="Type a category and press Enter..."
                               autocomplete="off">

                        <!-- Suggestions Dropdown (Hidden by default) -->
                        <div id="suggestionsDropdown" class="suggestions-dropdown" style="display:none;"></div>
                    </div>
                    <small style="color:#888;">Add up to 5 relevant tags to help buyers find your item.</small>
                </div>

                <div class="input-group full-width">
                    <label>Description <span class="required-star">*</span></label>
                    <textarea id="description" class="form-control" placeholder="Describe the item, mention any flaws, accessories included, etc." required minlength="10"></textarea>
                </div>
            </div>

            <!-- Image Upload -->
            <div class="input-group full-width">
                <label>Item Photo</label>
                <div class="image-upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
                    <i class="fas fa-cloud-upload-alt upload-icon"></i>
                    <p class="upload-text">Click to upload or drag and drop<br><small>PNG, JPG up to 5MB</small></p>
                    <img id="previewImg" class="preview-img" alt="Preview">
                    <button type="button" id="removeImgBtn" class="remove-btn">&times;</button>
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFileSelect(this)">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Post Listing</button>
        </form>
    </div>
</div>

<div id="toast">Listing created successfully!</div>

<script>
    const TOKEN_KEY = 'used_jwt_token';
    let selectedFile = null;
    let allCategories = []; // Cache loaded categories
    let selectedCategoryIds = []; // Track IDs for submission

    document.addEventListener('DOMContentLoaded', () => {
        checkAuth();
        loadCategoriesForTags();
        setupDragDrop();
        setupTagInput();
    });

    function checkAuth() {
        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) {
            alert("You must be logged in to sell an item.");
            window.location.href = '/login';
        }
    }

    // --- LOAD CATEGORIES FOR AUTOCOMPLETE ---
    async function loadCategoriesForTags() {
        const token = localStorage.getItem(TOKEN_KEY);
        try {
            const res = await fetch('/api/categories', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                allCategories = await res.json();
            }
        } catch (err) {
            console.error("Failed to load categories", err);
        }
    }

    // --- TAG INPUT LOGIC ---
    function setupTagInput() {
        const input = document.getElementById('categoryInput');
        const container = document.getElementById('tagContainer');
        const tagsList = document.getElementById('selectedTags');
        const dropdown = document.getElementById('suggestionsDropdown');

        // Click anywhere in container focuses input
        container.addEventListener('click', () => input.focus());

        input.addEventListener('input', (e) => {
            const val = e.target.value.trim().toLowerCase();
            if (val.length > 0) {
                showSuggestions(val);
            } else {
                hideSuggestions();
            }
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const val = input.value.trim();
                if (val) addTag(val);
            } else if (e.key === 'Backspace' && input.value === '') {
                removeLastTag();
            }
        });

        function showSuggestions(query) {
            // Filter available categories not already selected
            const matches = allCategories.filter(cat =>
                cat.name.toLowerCase().includes(query) &&
                !selectedCategoryIds.includes(cat.id)
            ).slice(0, 5); // Limit to 5 results

            if (matches.length === 0) {
                dropdown.innerHTML = '<div class="no-results">No matching categories found</div>';
            } else {
                dropdown.innerHTML = matches.map(cat =>
                    `<div class="suggestion-item" onclick="addTagById(${cat.id}, '${cat.name}')">${cat.name}</div>`
                ).join('');
            }
            dropdown.style.display = 'block';
        }

        function hideSuggestions() {
            dropdown.style.display = 'none';
        }

        // Global functions attached to window so inline onclick works
        window.addTagById = (id, name) => {
            if (selectedCategoryIds.includes(id)) return;
            if (selectedCategoryIds.length >= 5) {
                showToast("Max 5 tags allowed.", true);
                return;
            }

            selectedCategoryIds.push(id);

            // Create Chip
            const chip = document.createElement('div');
            chip.className = 'tag-chip';
            chip.innerHTML = `<span>${name}</span><i class="fas fa-times tag-remove" onclick="removeTagById(${id})"></i>`;
            tagsList.appendChild(chip);

            input.value = '';
            hideSuggestions();
        };

        window.removeTagById = (id) => {
            selectedCategoryIds = selectedCategoryIds.filter(cid => cid !== id);
            // Re-render chips (simple approach: clear and rebuild or just remove DOM node)
            // For efficiency, we'll just remove the specific DOM element
            const chips = Array.from(tagsList.children);
            chips.forEach(c => {
                if (c.querySelector('.tag-remove').getAttribute('onclick').includes(id)) {
                    c.remove();
                }
            });
        };

        // Helper for manual typing (if user types exact name)
        window.addTag = (name) => {
            const match = allCategories.find(c => c.name.toLowerCase() === name.toLowerCase());
            if (match) {
                window.addTagById(match.id, match.name);
            } else {
                showToast(`Category "${name}" not found. Select from list.`, true);
            }
        };

        function removeLastTag() {
            if (selectedCategoryIds.length > 0) {
                const lastId = selectedCategoryIds[selectedCategoryIds.length - 1];
                window.removeTagById(lastId);
            }
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!container.contains(e.target)) {
                hideSuggestions();
            }
        });
    }

    // --- IMAGE HANDLING (Same as before) ---
    function handleFileSelect(input) {
        const file = input.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { showToast("Image too large.", true); return; }
        if (!file.type.startsWith('image/')) { showToast("Invalid file type.", true); return; }

        selectedFile = file;
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = document.getElementById('previewImg');
            img.src = e.target.result;
            img.style.display = 'block';
            document.querySelector('.upload-icon').style.display = 'none';
            document.querySelector('.upload-text').style.display = 'none';
            document.getElementById('removeImgBtn').style.display = 'block';
            document.getElementById('dropZone').classList.add('has-image');
        };
        reader.readAsDataURL(file);
    }

    document.getElementById('removeImgBtn')?.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedFile = null;
        document.getElementById('fileInput').value = '';
        document.getElementById('previewImg').style.display = 'none';
        document.querySelector('.upload-icon').style.display = 'block';
        document.querySelector('.upload-text').style.display = 'block';
        document.getElementById('removeImgBtn').style.display = 'none';
        document.getElementById('dropZone').classList.remove('has-image');
    });

    function setupDragDrop() {
        const zone = document.getElementById('dropZone');
        ['dragenter', 'dragover'].forEach(eventName => {
            zone.addEventListener(eventName, (e) => { e.preventDefault(); zone.style.borderColor = '#a06cd5'; }, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            zone.addEventListener(eventName, (e) => { e.preventDefault(); zone.style.borderColor = '#ddd'; }, false);
        });
        zone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length) handleFileSelect({ files: files });
        }, false);
    }

    // --- SUBMIT FORM ---
    document.getElementById('createListingForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const token = localStorage.getItem(TOKEN_KEY);
        if (!token) { window.location.href = '/login'; return; }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Publishing...';

        // Construct Payload with Categories Array
        const listingData = {
            title: document.getElementById('title').value.trim(),
            description: document.getElementById('description').value.trim(),
            price: parseFloat(document.getElementById('price').value),
            condition: document.getElementById('condition').value,
            location: document.getElementById('location').value.trim(),
            status: "ACTIVE",
            // Send array of objects with just ID, matching @ManyToMany expectation
            categories: selectedCategoryIds.map(id => ({ id: id }))
        };

        try {
            const res = await fetch('/api/listings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(listingData)
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(errText || "Failed to create listing");
            }

            const createdListing = await res.json();
            const listingId = createdListing.id;

            // Upload Image if present
            if (selectedFile) {
                const formData = new FormData();
                formData.append('img', selectedFile);
                await fetch(`/api/listings/${listingId}/image`, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token },
                    body: formData
                });
            }

            showToast("Listing published successfully!");
            setTimeout(() => window.location.href = '/', 1500);

        } catch (err) {
            console.error(err);
            showToast("Error: " + err.message, true);
            btn.disabled = false;
            btn.textContent = 'Post Listing';
        }
    });

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#e74c3c' : '#2ecc71';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }
</script>

</body>
</html>
