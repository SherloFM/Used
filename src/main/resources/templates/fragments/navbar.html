<!-- Shared navbar for all pages -->
<nav th:fragment="nav" class="navbar">
    <div class="logo" onclick="location.href='/'">
        <i class="fas fa-recycle"></i> Used
    </div>

    <div class="search-container" id="globalSearchContainer" style="flex-grow:1;max-width:700px;margin:0 2rem;display:flex;">
        <div class="tag-input-wrapper" id="globalTagWrapper">
            <div id="searchTagsList" class="tags-list" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
            <input type="text" id="globalCategoryInput" class="tag-field" placeholder="Add categories..." autocomplete="off">
            <div id="globalSuggestionsDropdown" class="suggestions-dropdown"></div>
        </div>
        <input type="text" id="keywordInput" class="search-keyword-input" placeholder="Search keywords...">
        <button onclick="handleNavSearch()" class="search-btn"><i class="fas fa-search"></i></button>
    </div>

    <div class="nav-actions" style="display:flex;align-items:center;gap:16px;">
        <button class="nav-icon-btn" onclick="location.href='/create-listing'" title="Sell Item" style="background:none;border:none;font-size:1.4rem;color:#555;cursor:pointer;">
            <i class="fas fa-plus-circle"></i>
        </button>

        <div class="notification-wrapper" style="position:relative;">
            <button class="nav-icon-btn" onclick="toggleNotifDropdown(event)" title="Notifications" style="background:none;border:none;font-size:1.4rem;color:#555;cursor:pointer;position:relative;">
                <i class="fas fa-bell"></i>
                <span id="notifBadge" style="position:absolute;top:-6px;right:-8px;background:#e74c3c;color:white;border-radius:50%;padding:1px 6px;font-size:0.7rem;display:none;">0</span>
            </button>
            <div id="notifDropdown" style="position:absolute;right:0;top:42px;background:white;min-width:320px;box-shadow:0 10px 30px rgba(0,0,0,0.12);border-radius:12px;display:none;z-index:10000;max-height:420px;overflow-y:auto;">
                <div style="padding:12px 16px;border-bottom:1px solid #f1f1f1;font-weight:600;display:flex;justify-content:space-between;align-items:center;">
                    <span>Notifications</span>
                    <button onclick="clearNotifications()" style="background:none;border:none;color:#a06cd5;cursor:pointer;font-size:0.9rem;">Clear all</button>
                </div>
                <div id="notifList"><p style="padding:18px;color:#999;text-align:center;">No notifications yet</p></div>
            </div>
        </div>

        <div class="user-menu-wrapper" style="position:relative;">
            <button class="nav-user-btn" onclick="toggleUserMenu(event)" style="background:none;border:none;display:flex;align-items:center;gap:8px;cursor:pointer;">
                <div id="navAvatar" style="width:36px;height:36px;border-radius:50%;background:linear-gradient(90deg,#6ec3f4,#a06cd5);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;overflow:hidden;">
                    <i class="fas fa-user"></i>
                    <img id="navAvatarImg" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
                </div>
                <i class="fas fa-chevron-down" style="color:#999;font-size:0.8rem;"></i>
            </button>
            <div id="userDropdown" class="dropdown-menu" style="position:absolute;right:0;top:48px;background:white;min-width:220px;box-shadow:0 10px 30px rgba(0,0,0,0.12);border-radius:12px;padding:8px 0;display:none;z-index:10000;">
                <div class="dropdown-header" id="userDropdownHeader" style="padding:8px 16px;font-size:0.9rem;color:#666;">Guest</div>
                <div style="height:1px;background:#f1f1f1;margin:6px 0;"></div>
                <a href="/profile" class="dropdown-item" style="display:flex;align-items:center;gap:10px;padding:10px 16px;color:#333;text-decoration:none;"><i class="fas fa-user"></i> My Profile</a>
                <a href="/create-listing" class="dropdown-item" style="display:flex;align-items:center;gap:10px;padding:10px 16px;color:#333;text-decoration:none;"><i class="fas fa-tag"></i> Sell an Item</a>
                <button class="dropdown-item danger" onclick="logoutUser()" style="display:flex;align-items:center;gap:10px;padding:10px 16px;color:#e74c3c;background:none;border:none;width:100%;text-align:left;cursor:pointer;"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </div>
</nav>

<div id="toastContainer" style="position:fixed;bottom:20px;right:20px;z-index:10005;display:flex;flex-direction:column;gap:10px;"></div>
<div id="toast" style="position:fixed;bottom:20px;right:20px;background:#2ecc71;color:white;padding:12px 20px;border-radius:8px;box-shadow:0 5px 15px rgba(0,0,0,0.2);transform:translateY(100px);opacity:0;transition:all 0.3s ease;z-index:10006;"></div>
<div id="lockModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:10000;align-items:center;justify-content:center;">
    <div style="background:white;padding:2rem;border-radius:12px;max-width:400px;text-align:center;">
        <h3>Login Required</h3>
        <p style="margin:1rem 0;color:#666;">Please log in to continue.</p>
        <button class="btn-primary" onclick="location.href='/login'">Log In</button>
    </div>
</div>
