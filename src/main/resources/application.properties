spring.application.name=Used
server.port=8080

# Shared multipart limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Payment thread pool (Step 3) ---
# Keep core-size <= HikariCP spring.datasource.hikari.maximum-pool-size (default 10)
payment.pool.core-size=4
payment.pool.queue-capacity=50
payment.pool.shutdown-wait-seconds=30